name: Stop stalled chat test
on:
  push:
    branches: ['AlienFlow(chat)']
    paths: ['.github/workflows/chat-unblock-test.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel_owned_test:
    if: github.repository == 'IssisX/AlienFlow' && github.ref == 'refs/heads/AlienFlow(chat)'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the superseded chat test with exact source guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base='https://api.github.com/repos/IssisX/AlienFlow/actions/runs/38312538054'
          def call(path='', method='GET'):
              req=urllib.request.Request(base+path, method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data=r.read(); return json.loads(data) if data else {'http':r.status}
              except urllib.error.HTTPError as e:
                  if method=='POST' and e.code==409: return {'http':409}
                  raise RuntimeError('GitHub control HTTP '+str(e.code)) from None
          r=call()
          assert r['head_branch']=='AlienFlow(chat)' and r['head_sha']=='53c156ea1139bfe901f2c1da3cd074977d0cdbbf', 'Target changed; refusing cancellation'
          if r['status']!='completed':
              print('Cancel superseded chat test:',call('/cancel','POST'))
              for _ in range(12):
                  time.sleep(5)
                  if call()['status']=='completed': break
              else:
                  print('Normal cancellation did not finish; force-cancelling this exact owned run:',call('/force-cancel','POST'))
          print('Owned run state:',call()['status'])
          PY
