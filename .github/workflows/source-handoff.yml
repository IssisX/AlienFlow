name: AlienFlow chat source handoff
on:
  workflow_dispatch:
  push:
    branches: ['AlienFlow(chat)']
    paths: ['.github/workflows/source-handoff.yml']
permissions:
  contents: read
concurrency:
  group: alienflow-chat-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source and pinned installed revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git cat-file -e 5e248ee3a9c4c91a0c78580f0917d641e7035b15^{commit}
          git cat-file -e 2c3f36d8cebfb5aff124191f1b00ee21892b9fae^{commit}
          git update-ref refs/heads/source-installed-0.1.21 5e248ee3a9c4c91a0c78580f0917d641e7035b15
          git update-ref refs/heads/source-upstream-readonly 2c3f36d8cebfb5aff124191f1b00ee21892b9fae
          git bundle create "${RUNNER_TEMP}/AlienFlow-chat-source.bundle" HEAD refs/heads/source-installed-0.1.21 refs/heads/source-upstream-readonly
          git bundle verify "${RUNNER_TEMP}/AlienFlow-chat-source.bundle"
          git bundle list-heads "${RUNNER_TEMP}/AlienFlow-chat-source.bundle"
          sha256sum "${RUNNER_TEMP}/AlienFlow-chat-source.bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/AlienFlow-chat-source.bundle
          archive: false
          if-no-files-found: error
          retention-days: 2
