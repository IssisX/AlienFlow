name: AlienFlow2 source handoff
on:
  workflow_dispatch:
  push:
    branches: [AlienFlow2]
    paths: ['.github/workflows/source-handoff.yml']
permissions:
  contents: read
concurrency:
  group: alienflow2-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git bundle create "${RUNNER_TEMP}/AlienFlow2-source.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/AlienFlow2-source.bundle"
          sha256sum "${RUNNER_TEMP}/AlienFlow2-source.bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/AlienFlow2-source.bundle
          archive: false
          if-no-files-found: error
          retention-days: 2
