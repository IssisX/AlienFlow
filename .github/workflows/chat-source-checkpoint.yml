name: AlienFlow chat source checkpoint
on:
  workflow_dispatch:
  push:
    branches: ['AlienFlow(chat)']
    paths: ['.github/workflows/chat-source-checkpoint.yml']
permissions:
  contents: read
concurrency:
  group: alienflow-chat-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export exact tracked source and history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git bundle create "${RUNNER_TEMP}/AlienFlow-chat-source.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/AlienFlow-chat-source.bundle"
          sha256sum "${RUNNER_TEMP}/AlienFlow-chat-source.bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/AlienFlow-chat-source.bundle
          archive: false
          if-no-files-found: error
          retention-days: 3
